services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '4321:4321'
    environment:
      APP_MODE: all # web + workers in one container; split into two services for scale
      DATABASE_URL: postgres://openpublish:openpublish@postgres:5432/openpublish
      REDIS_URL: redis://redis:6379
      BASE_URL: ${BASE_URL:-http://localhost:4321}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      STORAGE: local
      MEDIA_DIR: /app/uploads
    env_file:
      - path: .env
        required: false
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openpublish
      POSTGRES_PASSWORD: openpublish
      POSTGRES_DB: openpublish
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openpublish']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
